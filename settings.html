<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
        <title>Download Manager Settings</title>
        <link rel="stylesheet" href="settings.css" />
    </head>
    <body>
        <main class="card">
            <header>
                <div class="eyebrow">LEGCORD PLUGIN</div>
                <h1>Download Manager</h1>
                <p>Choose where Legcord sends download links.</p>
            </header>

            <form id="settings-form">
                <label class="field" for="manager">
                    <span>Download destination</span>
                    <select id="manager" name="manager">
                        <option value="browser">Legcord / browser</option>
                        <option value="gopeed">Gopeed</option>
                        <option value="idm">Internet Download Manager</option>
                    </select>
                </label>

                <section id="gopeed-fields" class="subsection" hidden>
                    <p class="note">Downloads open Gopeed's create-task window for review. Gopeed's registered <code>gopeed://</code> link handler must be available on this device.</p>
                </section>

                <p id="idm-note" class="note" hidden>IDM routing is available on Windows.</p>
                <div class="actions">
                    <button id="close" class="secondary" type="button">Close</button>
                    <button id="save" class="primary" type="submit">Save settings</button>
                </div>
                <p id="status" class="status" role="status" aria-live="polite"></p>
            </form>
        </main>
        <script src="settings-window.js"></script>
    </body>
</html>
